name: macOS Legacy Build (10.13/10.14)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      display-version:
        description: "Display version (e.g. 1.23.4b-mojave)"
        required: true
        default: "1.23.4b-mojave"
      use-sccache:
        description: "Use sccache"
        type: boolean
        default: true
  push:
    branches:
      - legacy-macos
    paths:
      - "src/**"
      - "configs/macos/**"
      - ".github/workflows/legacy-macos-build.yml"

concurrency:
  group: macos-legacy-build
  cancel-in-progress: false

jobs:
  mac-legacy-build:
    name: Build macOS x86_64 (legacy)
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: ${{ inputs.use-sccache != false && 'true' || 'false' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # Критически важно: целевая версия macOS для Rust-компонентов
      MACOSX_DEPLOYMENT_TARGET: "10.14"
      # Отключаем LTO для Rust, чтобы избежать несовместимости с кросс-линковщиком
      MOZ_LTO: ""
      MOZ_LTO_RUST_CROSS: ""
    timeout-minutes: 360

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Verify Surfer
        run: npx surfer --version

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main
        if: ${{ inputs.use-sccache != false }}
        with:
          disable_annotations: true

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip zstd yasm nasm build-essential \
            libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev \
            libcurl4-openssl-dev libdbus-1-dev libdrm-dev \
            libdbus-glib-1-dev libgtk-3-dev libpulse-dev \
            libx11-xcb-dev libxt-dev libx11-dev --fix-missing

      - name: Load Surfer CI setup
        env:
          DISPLAY_VERSION: ${{ inputs.display-version || '1.23.4b-mojave' }}
        run: npm run surfer -- ci --brand release --display-version "$DISPLAY_VERSION"

      - name: Download Firefox and dependencies
        run: npm run download

      - name: Setup for macOS (cctools and DMG tools)
        id: cache-mac-cross
        uses: actions/cache@v4
        with:
          path: ~/mac-cross
          key: mac-cross-legacy

      - name: Fetch mac-cross toolchain
        if: steps.cache-mac-cross.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/mac-cross
          cd engine/
          ./mach artifact toolchain --from-build linux64-cctools-port linux64-libdmg linux64-hfsplus
          mv cctools dmg hfsplus ~/mac-cross/
          ls ~/mac-cross/cctools/bin/x86_64-apple-darwin-ld

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          source "$HOME/.cargo/env"
          rustup target add x86_64-apple-darwin

      # ⬇️⬇️⬇️ ФИКС Bug 2068758: undefined _ggml_backend_metal_disable ⬇️⬇️⬇️
      - name: Apply Bug 2068758 fix (mozinference metal-disable)
        shell: bash
        run: |
          set -euo pipefail
          cd engine

          # --- Попытка №1: cherry-pick upstream-патча ---
          echo "::group::Try upstream cherry-pick (Bug 2068758)"
          UPSTREAM=https://github.com/mozilla-firefox/firefox.git
          UPSTREAM_COMMIT=500af56f0ad8bfbaa9b69031549d73a7ba9d9419
          if git -c protocol.version=2 fetch --no-tags --depth=1 "$UPSTREAM" "$UPSTREAM_COMMIT"; then
            if git cherry-pick --no-commit FETCH_HEAD; then
              echo "✅ Upstream cherry-pick applied successfully"
              git reset  # оставляем изменения только в рабочем дереве
              echo "::endgroup::"
              exit 0
            else
              echo "⚠️ cherry-pick failed, aborting and falling back to manual patch"
              git cherry-pick --abort || true
              git reset --hard HEAD
            fi
          fi
          echo "::endgroup::"

          # --- Попытка №2: ручной патч ---
          echo "::group::Manual fallback patch"

          # 2a. Убираем опасный символ из списка экспорта линкера.
          #     Именно из-за него ld падает с "Undefined symbols ... -exported_symbol".
          SYMBOLS_FILE=""
          for candidate in \
              "config/external/mozinference/mozinference.symbols" \
              "config/external/mozinference/mozinference.symbols.allowlist" \
              "third_party/llama.cpp/mozinference.symbols" ; do
            if [ -f "$candidate" ]; then
              SYMBOLS_FILE="$candidate"
              break
            fi
          done
          if [ -z "$SYMBOLS_FILE" ]; then
            SYMBOLS_FILE=$(grep -RIl --include='*.symbols' --include='*.symbols.allowlist' \
              'ggml_backend_metal_disable' . 2>/dev/null | head -n1 || true)
          fi

          if [ -n "$SYMBOLS_FILE" ] && [ -f "$SYMBOLS_FILE" ]; then
            echo "Patching symbols file: $SYMBOLS_FILE"
            # Комментируем строку с символом, чтобы не ломать формат файла
            sed -i \
              -E 's@^([[:space:]]*)ggml_backend_metal_disable([[:space:]]*)$@\1# [bug2068758] \2@' \
              "$SYMBOLS_FILE" || \
              sed -i 's@ggml_backend_metal_disable@# ggml_backend_metal_disable # bug2068758@' "$SYMBOLS_FILE"
            echo "--- after patch ---"
            grep -n 'ggml_backend_metal_disable' "$SYMBOLS_FILE" || echo "(symbol no longer present)"
          else
            echo "::warning::symbols file with ggml_backend_metal_disable not found; skipping 2a"
          fi

          # 2b. Добавляем stub-определение функции, если Metal отключён.
          GGML_METAL=$(find third_party -type f -name 'ggml-metal.cpp' 2>/dev/null | head -n1 || true)
          if [ -z "$GGML_METAL" ]; then
            GGML_METAL=$(find . -type f -name 'ggml-metal.cpp' 2>/dev/null | head -n1 || true)
          fi
          if [ -n "$GGML_METAL" ] && [ -f "$GGML_METAL" ]; then
            echo "Patching C++ stub into: $GGML_METAL"
            if ! grep -q 'ggml_backend_metal_disable' "$GGML_METAL"; then
              cat >> "$GGML_METAL" <<'CPP_EOF'

// [bug2068758] Stub so the export symbol always resolves on cross builds
// where Metal is not compiled.
#if !defined(GGML_USE_METAL)
extern "C" void ggml_backend_metal_disable(void) {}
#endif
CPP_EOF
            fi
          else
            echo "::warning::ggml-metal.cpp not found; skipping 2b (relies on 2a)"
          fi

          echo "::endgroup::"
      # ⬆️⬆️⬆️ /ФИКС Bug 2068758 ⬆️⬆️⬆️

      - name: Import
        env:
          SURFER_COMPAT: x86_64
          SURFER_PLATFORM: darwin
        run: |
          . "$HOME/.cargo/env"
          npm run import -- --verbose

      - name: Bootstrap
        run: |
          export SURFER_PLATFORM="darwin"
          npm run bootstrap

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Import MAR signing certificate into updater
        run: |
          set -e
          if [ ! -f build/signing/public_key.der ]; then
            echo "No committed public_key.der, generating our own..."
            bash scripts/mar_sign.sh -g
          fi
          bash scripts/mar_sign.sh -i

      # Чистим артефакты, чтобы старые объектники не «прилипали»
      - name: Clean build artifacts
        run: |
          cd engine
          ./mach clobber || true

      - name: Build
        env:
          SURFER_COMPAT: x86_64
          SURFER_PLATFORM: darwin
          ZEN_CROSS_COMPILING: "1"
          ZEN_RELEASE: "1"
          ZEN_GA_DISABLE_PGO: "1"
          ZEN_SAFEBROWSING_API_KEY: ${{ secrets.ZEN_SAFEBROWSING_API_KEY }}
          ZEN_MOZILLA_API_KEY: ${{ secrets.ZEN_MOZILLA_API_KEY }}
          ZEN_GOOGLE_LOCATION_SERVICE_API_KEY: ${{ secrets.ZEN_GOOGLE_LOCATION_SERVICE_API_KEY }}
        run: |
          set -e
          ulimit -n 4096
          npm run build
          echo "Build complete"

      - name: Package
        env:
          SURFER_COMPAT: x86_64
          SURFER_PLATFORM: darwin
          ZEN_CROSS_COMPILING: "1"
          ZEN_RELEASE: "1"
          ZEN_GA_DISABLE_PGO: "1"
        run: |
          set -e
          npm run package

      - name: Rename artifacts
        run: |
          set -ex
          mv ./dist/*.dmg ./zen-mojave-x86_64-apple-darwin-dist.dmg
          mv ./engine/obj-x86_64-apple-darwin/dist/bin/platform.ini ./platform.ini

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: zen-mojave-x86_64-apple-darwin-dist
          path: ./zen-mojave-x86_64-apple-darwin-dist.dmg

      - name: Upload platform.ini
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: zen-mojave-platform-ini
          path: ./platform.ini
